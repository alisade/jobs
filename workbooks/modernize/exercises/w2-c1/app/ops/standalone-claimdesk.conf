# JBoss EAP 7.4 standalone.conf overrides for the ClaimDesk hosts (cdk-app-01..04, RHEL 7)
JAVA_HOME=/usr/lib/jvm/jre-1.8.0-openjdk
JAVA_OPTS="-Xms4g -Xmx4g -XX:MetaspaceSize=256m"
JAVA_OPTS="${JAVA_OPTS} -Duser.timezone=America/New_York"
JAVA_OPTS="${JAVA_OPTS} -Dfile.encoding=ISO-8859-1"
JAVA_OPTS="${JAVA_OPTS} -Dclaimdesk.config=/etc/claimdesk/claimdesk.properties"
JAVA_OPTS="${JAVA_OPTS} -Djboss.bind.address=0.0.0.0"
