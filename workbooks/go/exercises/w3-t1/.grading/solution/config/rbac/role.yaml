---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - resourcequotas
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - platform.harbor-analytics.io
  resources:
  - tenants
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.harbor-analytics.io
  resources:
  - tenants/finalizers
  verbs:
  - update
- apiGroups:
  - platform.harbor-analytics.io
  resources:
  - tenants/status
  verbs:
  - get
  - patch
  - update
