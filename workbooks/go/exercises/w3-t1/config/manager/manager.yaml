apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-operator
  namespace: tenant-system
  labels:
    app.kubernetes.io/name: tenant-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-operator
    spec:
      serviceAccountName: tenant-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: 551234567890.dkr.ecr.us-east-1.amazonaws.com/platform/tenant-operator:v0.4.0
          args: ["--leader-elect", "--health-probe-bind-address=:8081"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
