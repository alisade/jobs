# LFG Avaya SBCE - Ashburn B (sbce-ash-b.lfg.internal). Simplified export of the trunk profile
# for the Amazon Chime SDK Voice Connector trunk. Owner: telephony-platform. Last change: CHG0031877, fixed by CHG0031904 (media public-ip)
[device]
name = ashburn-sbce-b
site = ashburn

[signaling-interface trunk-vc]
ip = 10.20.4.22
public-ip = 198.51.100.11
port = 5061
transport = tls

[media-interface trunk-vc-media]
ip = 10.20.8.15
public-ip = 198.51.100.11
rtp-port-range = 35000-40000

[sdp]
profile = RTP/SAVP
crypto-suite = AES_CM_128_HMAC_SHA1_80
codec-order = PCMU,PCMA
telephone-event-pt = 127
ptime = 20
