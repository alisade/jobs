# LFG Avaya SBCE - Ashburn A (sbce-ash-a.lfg.internal). Simplified export of the trunk profile
# for the Amazon Chime SDK Voice Connector trunk. Owner: telephony-platform. Last change: CHG0030112
[device]
name = ashburn-sbce-a
site = ashburn

[signaling-interface trunk-vc]
ip = 10.20.4.21
public-ip = 198.51.100.10
port = 5061
transport = tls

[media-interface trunk-vc-media]
ip = 10.20.4.21
public-ip = 198.51.100.10
rtp-port-range = 35000-40000

[sdp]
profile = RTP/SAVP
crypto-suite = AES_CM_128_HMAC_SHA1_80
codec-order = PCMU,PCMA
telephone-event-pt = 127
ptime = 20
