spring.application.name=kestrel-progress-api
spring.datasource.url=jdbc:h2:mem:progress;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Cloud Run: 4 instances x 10 connections = 40 of the Cloud SQL db-custom-2 instance's 100.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Statistics feed the "statements per request" log line and the Cloud Monitoring custom metric.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
