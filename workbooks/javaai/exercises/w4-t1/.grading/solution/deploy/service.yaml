# Cloud Run service tutor-agent (gcloud run services replace deploy/service.yaml)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tutor-agent
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: tutor-agent@kestrel-prod.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/kestrel-prod/apps/tutor-agent:1.4.2
          command: ["uvicorn", "tutorsvc.app:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
            periodSeconds: 2
            failureThreshold: 15
