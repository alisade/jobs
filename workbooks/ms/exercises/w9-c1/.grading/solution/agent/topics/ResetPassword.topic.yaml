kind: AdaptiveDialog
modelDescription: |-
  Resets the user's OWN password, or unlocks their OWN account, for Windows sign-in, VPN or SAP.
  Use it when the user says they forgot their password, are locked out, or their password expired.
  Do not use it for someone else's account, for MFA or authenticator app problems, or to change a
  password the user still knows.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Reset password
    triggerQueries:
      - I forgot my password
      - reset my password
      - I'm locked out of my account
      - my password expired
      - can't log in to VPN
      - unlock my account

  actions:
    - kind: Question
      id: question_ownAccount
      interruptionPolicy:
        allowInterruption: false
      variable: init:Topic.IsOwnAccount
      prompt: Is this for your own account?
      entity: BooleanPrebuiltEntity

    - kind: ConditionGroup
      id: conditionGroup_ownAccount
      conditions:
        - id: conditionItem_isOwn
          condition: =Topic.IsOwnAccount = true
          actions:
            - kind: Question
              id: question_system
              variable: init:Topic.SystemName
              prompt: Which system are you locked out of - Windows sign-in, VPN or SAP?
              entity: StringPrebuiltEntity

            - kind: InvokeFlowAction
              id: invokeFlowAction_reset
              input:
                binding:
                  upn: =Global.UserUpn
                  system: =Topic.SystemName
              output:
                binding:
                  resetStatus: Topic.ResetStatus
              flowId: 0f3c2a10-6c1e-4b8e-9a52-5d0c1f7e2a11

            - kind: ConditionGroup
              id: conditionGroup_resetStatus
              conditions:
                - id: conditionItem_resetOk
                  condition: =Topic.ResetStatus = "Success"
                  actions:
                    - kind: SendActivity
                      id: sendMessage_resetOk
                      activity: Done. Your {Topic.SystemName} password has been reset. Check your registered phone for the temporary password.

              elseActions:
                - kind: SetVariable
                  id: setVariable_reasonFailed
                  variable: Global.EscalationReason
                  value: PasswordResetFailed

                - kind: BeginDialog
                  id: beginDialog_escalateFailed
                  dialog: litware_itdesk.topic.Escalate

      elseActions:
        - kind: SendActivity
          id: sendMessage_notOwn
          activity: I can only reset your own password. For someone else's account, their manager needs to raise a request in the IT portal.

        - kind: EndDialog
          id: endDialog_notOwn
