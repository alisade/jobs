# Given. Runs once per conversation (system topic). Do not change the variable names.
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SetVariable
      id: setVariable_upn
      variable: Global.UserUpn
      value: =System.User.PrincipalName

    - kind: SetVariable
      id: setVariable_reason
      variable: Global.EscalationReason
      value: =Blank()

    - kind: SendActivity
      id: sendMessage_greeting
      activity: Hi, I'm the Litware IT Service Desk agent. I can reset passwords, and I can hand you to a technician. Some responses are generated by AI.
