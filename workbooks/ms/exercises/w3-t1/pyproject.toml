[project]
name = "contoso-retail-fabric"
version = "0.1.0"
description = "Contoso Retail Sales Fabric workspace (git-synced) and fabric-cicd release tooling"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["deploy"]
