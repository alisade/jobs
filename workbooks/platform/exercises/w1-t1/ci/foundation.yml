# .github/workflows/foundation.yml in tessellate/platform-foundation (copied here for the incident)
name: foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # required to request the GitHub OIDC token

env:
  WIF_PROVIDER: projects/417203958311/locations/global/workloadIdentityPools/github/providers/github-actions
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: tf-plan@tsl-platform-ci.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock=false -out=tfplan
      - run: terraform show -json tfplan > plan.json && python3 ci/guardrails.py plan.json

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production        # required reviewers: gcp-platform-admins; deployment branch: main
    concurrency: foundation-apply
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: tf-apply@tsl-platform-ci.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
