---
# Source: mdm-api/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mdm-api
  namespace: mdm
  labels:
    app.kubernetes.io/name: mdm-api
  annotations:
    iam.gke.io/gcp-service-account: mdm-api@tsl-mdm-prod.iam.gserviceaccount.com
automountServiceAccountToken: false
---
# Source: mdm-api/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: mdm-api
  namespace: mdm
spec:
  selector:
    app.kubernetes.io/name: mdm-api
  ports:
    - port: 80
      targetPort: 8080
---
# Source: mdm-api/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mdm-api
  namespace: mdm
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mdm-api
---
# Source: mdm-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdm-api
  namespace: mdm
  labels:
    app.kubernetes.io/name: mdm-api
    helm.sh/chart: mdm-api-2.8.1
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mdm-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdm-api
    spec:
      serviceAccountName: mdm-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: us-docker.pkg.dev/tsl-artifacts-prod/mdm/mdm-api@sha256:c1e1b94505ca1361a4c463a5a665aa9b4c075823464c38caa3a36644e0bd6b60
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
# Source: mdm-api/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mdm-api
  namespace: mdm
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: mdm-api}
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
