# Source: riq-api/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: riq-api
  namespace: riq
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: riq-api
---
# Source: riq-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riq-api
  namespace: riq
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: riq-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riq-api
        app.kubernetes.io/version: "5.2.0"
    spec:
      serviceAccountName: riq-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: migrate
          image: us-docker.pkg.dev/tsl-artifacts-prod/riq/riq-migrate@sha256:c272fa7065c09dd34b509044911e97d20d65f0f389d10fd8214e896e4da861d7
          args: ["--check-only"]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: us-docker.pkg.dev/tsl-artifacts-prod/riq/riq-api@sha256:2853395b10a73fa08584985891c56e790a62fa347191f34df1ad0b7f1efd3219
          readinessProbe:
            httpGet: {path: /readyz, port: 8443, scheme: HTTPS}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Source: riq-api/templates/cronjob-reindex.yaml
# Nightly reindex added in chart 5.2.0 (PLAT-1184)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: riq-reindex
  namespace: riq
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: riq-reindex
        spec:
          restartPolicy: OnFailure
          serviceAccountName: riq-api
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: reindex
              image: busybox:1.36
              command: ["sh", "-c", "wget -qO- http://riq-api.riq.svc/admin/reindex"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
