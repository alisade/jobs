# Tessellate GKE fleet, fleet host project tsl-fleet-host. Exported 2026-11-12.
# All clusters are GKE Standard, VPC-native, private nodes, Workload Identity on, Dataplane V2.
clusters:
  - name: dev-1
    project: tsl-platform-dev
    location: us-central1-a        # zonal
    release_channel: REGULAR
    control_plane: 1.34.1-gke.1293000
    maintenance_window: none        # GKE picks any time
    node_pools:
      - {name: pool-default, machine: e2-standard-4, nodes: 3, version: 1.34.1-gke.1293000, upgrade: surge, max_surge: 1, max_unavailable: 0}
  - name: stg-1
    project: tsl-platform-stg
    location: us-central1           # regional
    release_channel: REGULAR
    control_plane: 1.34.1-gke.1293000
    maintenance_window: "Tue-Thu 14:00-18:00 UTC"
    node_pools:
      - {name: pool-default, machine: n2-standard-8, nodes: 6, version: 1.33.5-gke.1080000, upgrade: surge, max_surge: 1, max_unavailable: 0}
      - {name: pool-batch, machine: n2-highmem-8, nodes: 3, version: 1.33.5-gke.1080000, upgrade: surge, max_surge: 0, max_unavailable: 1}
  - name: prod-blue
    project: tsl-riq-prod            # also hosts mdm and rdm namespaces
    location: us-central1
    release_channel: STABLE
    control_plane: 1.33.5-gke.1080000
    maintenance_window: "Sat-Sun 06:00-12:00 UTC"
    maintenance_exclusions: []
    node_pools:
      - {name: pool-default-v2, machine: n2-standard-8, nodes: 18, version: 1.32.9-gke.1120000, upgrade: surge, max_surge: 1, max_unavailable: 0}
      - {name: pool-stateful, machine: n2-highmem-16, nodes: 6, version: 1.32.9-gke.1120000, upgrade: surge, max_surge: 1, max_unavailable: 0, notes: "mdm-search (Elasticsearch-like, 3 masters + 6 data pods, local SSD)"}
  - name: prod-green
    project: tsl-riq-prod
    location: us-east4
    release_channel: STABLE
    control_plane: 1.33.5-gke.1080000
    maintenance_window: "Sat-Sun 06:00-12:00 UTC"
    node_pools:
      - {name: pool-default-v2, machine: n2-standard-8, nodes: 18, version: 1.33.5-gke.1080000, upgrade: surge, max_surge: 1, max_unavailable: 0}
      - {name: pool-stateful, machine: n2-highmem-16, nodes: 6, version: 1.33.5-gke.1080000, upgrade: surge, max_surge: 1, max_unavailable: 0}
traffic:
  prod: "Global external Application Load Balancer, multi-cluster Gateway; 60/40 split prod-blue/prod-green; either region can take 100% for 4 hours at current size (HPA max replicas allow it, node pools need +8 nodes)"
planned_2027:
  - "10 more clusters: prod-eu-1 and prod-eu-2 (europe-west1/west4, data residency for 2 customers), 4 regional edge clusters for RDM caches, 2 PCI-scoped clusters for the payments ingestion pipeline, 2 ephemeral load-test clusters"
  - "team count grows from 9 to 15; the platform team stays at 6 engineers"
